<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFront IA — partie en direct</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171e26; --text: #e6e9ee; --muted: #8a96a3;
    --line: #2a3440; --accent: #4da3ff; --water: #16324a; --land: #c9c0a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  .stat { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat b { color: var(--text); font-weight: 600; }
  .speed { margin-left: auto; display: flex; gap: 4px; }
  .speed button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; }
  .speed button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  #wrap { flex: 1; min-width: 0; }
  canvas { width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px;
    background: var(--water); display: block; }
  aside { width: 300px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 3px 4px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td:nth-child(2), th:nth-child(2) { text-align: left; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  tr.dead td { color: var(--muted); text-decoration: line-through; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  #banner { margin-top: 10px; padding: 8px; border-radius: 6px; background: #1f3a24; display: none; }
  #empty { color: var(--muted); padding: 40px 0; text-align: center; }
  #legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; color: var(--muted); }
  #legend span { display: flex; align-items: center; gap: 6px; }
  #legend canvas { width: 20px; height: 20px; flex-shrink: 0; }
  .ia { display: inline-block; font-size: 10px; font-weight: 700; padding: 0 4px; margin-left: 4px;
    border-radius: 3px; background: #fff; color: #000; vertical-align: 1px; }
  .agent { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 12px; }
  .agent .act { margin: 4px 0; }
  .agent .ok { color: #6fd38a; } .agent .ko { color: #ff7b7b; }
  .bars { display: grid; grid-template-columns: 64px 1fr 34px; gap: 2px 6px; font-size: 12px;
    color: var(--muted); align-items: center; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  @media (max-width: 800px) { main { flex-direction: column; } aside { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>OpenFront IA — partie en direct</h1>
  <span class="stat">Carte <b id="map">—</b></span>
  <span class="stat">Tick <b id="tick">—</b></span>
  <span class="stat">Vitesse <b id="tps">—</b> ticks/s</span>
  <span class="stat" id="conn">connexion…</span>
  <div class="speed" id="speed">
    <button data-v="1">x1</button><button data-v="10">x10</button><button data-v="max">max</button>
  </div>
</header>
<main>
  <div id="wrap">
    <div id="empty">En attente d'une partie (lancez un agent).</div>
    <canvas id="c" hidden></canvas>
  </div>
  <aside>
    <div id="agents"></div>
    <h2>Classement</h2>
    <table>
      <thead><tr><th></th><th>Joueur</th><th>Tuiles</th><th>Troupes</th><th>Or</th></tr></thead>
      <tbody id="rank"></tbody>
    </table>
    <div id="banner"></div>
    <h2 style="margin-top:14px">Légende</h2>
    <div id="legend"></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");
let view = null; // { width, height, land: Uint8Array, image: ImageData }

async function inflate(b64) {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function cssColor(c) {
  // "hsl(h s% l%)" -> [r, g, b] via un canvas 1x1.
  const k = document.createElement("canvas").getContext("2d");
  k.fillStyle = c; k.fillRect(0, 0, 1, 1);
  return k.getImageData(0, 0, 1, 1).data;
}
const colorCache = new Map();
function rgb(c) { if (!colorCache.has(c)) colorCache.set(c, cssColor(c)); return colorCache.get(c); }

const WATER = [22, 50, 74], LAND = [201, 192, 168], FALLOUT = [96, 112, 44];

// Unités, dans l'ordre de VIEW_UNITS (env/src/live.ts).
const UNIT_TYPES = ["City", "Port", "Factory", "Defense Post", "Missile Silo", "SAM Launcher", "Transport",
  "Warship", "Trade Ship", "Train", "Atom Bomb", "Hydrogen Bomb", "MIRV", "MIRV Warhead", "SAMMissile"];
const UNIT_LABELS = ["Ville", "Port", "Usine", "Poste de défense", "Silo à missiles", "SAM", "Bateau de transport",
  "Navire de guerre", "Navire de commerce", "Train", "Bombe atomique", "Bombe H", "MIRV", "Ogive MIRV", "Missile SAM"];
const NUKES = new Set([10, 11, 12, 13]);
const units = new Map();      // id -> [id, type, propriétaire, x, y, cibleX, cibleY, en construction]
let explosions = [];          // { x, y, r, t }
let base = null;              // image du territoire, redessinée sous les unités à chaque frame d'animation
let palette = new Map();
let labels = [];

/** Forme d'une unité de type t, centrée en (x, y), taille s. */
function drawUnit(c, t, x, y, s, fill) {
  c.fillStyle = fill; c.strokeStyle = "#000"; c.lineWidth = Math.max(1, s / 4);
  c.beginPath();
  switch (t) {
    case 0: c.rect(x - s, y - s, 2 * s, 2 * s); break;                                   // ville : carré
    case 1: c.arc(x, y, s, 0, 2 * Math.PI); break;                                      // port : rond
    case 2: c.moveTo(x, y - s * 1.2); c.lineTo(x + s * 1.1, y + s); c.lineTo(x - s * 1.1, y + s); c.closePath(); break; // usine : triangle
    case 3: c.moveTo(x, y - s * 1.3); c.lineTo(x + s * 1.3, y); c.lineTo(x, y + s * 1.3); c.lineTo(x - s * 1.3, y); c.closePath(); break; // poste : losange
    case 4: for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k; c.lineTo(x + s * 1.2 * Math.cos(a), y + s * 1.2 * Math.sin(a)); } c.closePath(); break; // silo : hexagone
    case 5: c.rect(x - s * 1.2, y - s * 0.4, s * 2.4, s * 0.8); c.rect(x - s * 0.4, y - s * 1.2, s * 0.8, s * 2.4); break; // SAM : croix
    case 6: c.ellipse(x, y, s * 0.9, s * 0.55, 0, 0, 2 * Math.PI); c.strokeStyle = "#fff"; break; // transport
    case 7: c.moveTo(x - s * 1.6, y); c.lineTo(x, y - s * 0.8); c.lineTo(x + s * 1.6, y); c.lineTo(x, y + s * 0.8); c.closePath(); c.strokeStyle = "#fff"; break; // navire de guerre
    case 8: c.arc(x, y, s * 0.55, 0, 2 * Math.PI); c.strokeStyle = "#ffd34d"; break;  // commerce
    case 9: c.rect(x - s * 0.5, y - s * 0.5, s, s); break;                                // train
    case 13: case 14: c.arc(x, y, s * 0.45, 0, 2 * Math.PI); c.strokeStyle = "#fff"; break;
    default: c.arc(x, y, s * 0.8, 0, 2 * Math.PI); c.strokeStyle = "#fff";            // bombes
  }
  c.fill();
  if (t <= 5) {
    // Structure : double contour noir puis blanc, lisible sur le territoire de même couleur.
    c.lineWidth = Math.max(1.5, s / 2); c.strokeStyle = "#000"; c.stroke();
    c.lineWidth = Math.max(0.8, s / 5); c.strokeStyle = "#fff"; c.stroke();
  } else {
    c.stroke();
  }
}

const NUKE_COLORS = { 10: "#ff4d4d", 11: "#ff8c1a", 12: "#c86bff", 13: "#c86bff", 14: "#ffffff" };

function drawOverlay() {
  if (view === null || base === null) return;
  ctx.putImageData(base, 0, 0);
  const s = Math.max(3, view.width / 170);
  // Structures sous les unités mobiles, bombes par-dessus.
  const list = [...units.values()].sort((a, b) => a[1] - b[1]);
  for (const u of list) {
    const [, t, owner, x, y, tx, ty, building] = u;
    const color = palette.get(owner) ?? "#ccc";
    ctx.globalAlpha = building ? 0.5 : 1;
    if (NUKES.has(t) || t === 14) {
      if (tx >= 0 && t !== 14) {
        ctx.setLineDash([3, 3]); ctx.strokeStyle = NUKE_COLORS[t]; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(tx, ty, s * 1.5, 0, 2 * Math.PI); ctx.stroke();
      }
      drawUnit(ctx, t, x, y, s, NUKE_COLORS[t]);
    } else {
      drawUnit(ctx, t, x, y, t >= 6 ? s * 0.9 : s, color);
    }
  }
  ctx.globalAlpha = 1;
  const now = performance.now();
  explosions = explosions.filter((e) => now - e.t < 1500);
  for (const e of explosions) {
    const k = (now - e.t) / 1500;
    ctx.fillStyle = `rgba(255, ${Math.round(200 - 150 * k)}, 60, ${0.8 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.3 + k), 0, 2 * Math.PI); ctx.fill();
  }
  ctx.font = `bold ${Math.max(12, Math.round(view.width / 60))}px system-ui, sans-serif`;
  ctx.textAlign = "center"; ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.fillStyle = "#fff";
  for (const [label, x, y] of labels) { ctx.strokeText(label, x, y); ctx.fillText(label, x, y); }
}
function animate() { drawOverlay(); requestAnimationFrame(animate); }
requestAnimationFrame(animate);

function applyUnits(diff) {
  if (!diff) return;
  if (diff.full) units.clear();
  for (const u of diff.changed) units.set(u[0], u);
  for (const id of diff.removed) {
    const u = units.get(id);
    // Une bombe qui disparaît a explosé (sur sa cible) ou a été interceptée (là où elle était).
    if (u && NUKES.has(u[1]) && view) {
      const atTarget = u[5] >= 0 && Math.hypot(u[5] - u[3], u[6] - u[4]) < 3;
      explosions.push({ x: atTarget ? u[5] : u[3], y: atTarget ? u[6] : u[4], r: view.width / (u[1] === 11 ? 18 : 40), t: performance.now() });
    }
    units.delete(id);
  }
}

function renderLegend() {
  $("legend").innerHTML = UNIT_LABELS.slice(0, 14).map((l, t) => `<span><canvas width="32" height="32" data-t="${t}"></canvas>${l}</span>`).join("")
    + `<span><canvas width="32" height="32" data-fallout="1"></canvas>Retombées</span>`;
  for (const c of $("legend").querySelectorAll("canvas")) {
    const k = c.getContext("2d");
    if (c.dataset.fallout) { k.fillStyle = `rgb(${FALLOUT})`; k.fillRect(4, 4, 24, 24); continue; }
    const t = +c.dataset.t;
    drawUnit(k, t, 16, 16, 9, NUKES.has(t) ? NUKE_COLORS[t] : "#4da3ff");
  }
}
renderLegend();
const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);

async function onMap(m) {
  const land = await inflate(m.land);
  canvas.width = m.width; canvas.height = m.height;
  view = { width: m.width, height: m.height, land, image: ctx.createImageData(m.width, m.height) };
  $("map").textContent = `${m.map} (${m.size})`;
  $("empty").hidden = true; canvas.hidden = false;
}

async function onFrame(f) {
  $("tick").textContent = f.tick.toLocaleString("fr-FR");
  $("tps").textContent = f.ticksPerSecond.toLocaleString("fr-FR");
  for (const b of $("speed").children) b.classList.toggle("on", b.dataset.v === f.speed);
  if (view === null) return;
  const owners = new Uint16Array((await inflate(f.owners)).buffer);
  const rgbOf = new Map(f.players.map((p) => [p.id, rgb(p.color)]));
  const agents = f.agents ?? [];
  const agentIds = new Set(agents.map((a) => a.id));
  const W = view.width, px = view.image.data;
  // Centre de chaque territoire d'agent, pour son étiquette.
  const sums = new Map(agents.map((a) => [a.id, [0, 0, 0]]));
  for (let i = 0; i < owners.length; i++) {
    const o = owners[i] & 0x0fff;
    const fallout = owners[i] & 0x8000;
    let c = o ? rgbOf.get(o) ?? LAND : view.land[i] ? (fallout ? FALLOUT : LAND) : WATER;
    if (o && fallout) c = [(c[0] + FALLOUT[0]) >> 1, (c[1] + FALLOUT[1]) >> 1, (c[2] + FALLOUT[2]) >> 1];
    if (agentIds.has(o)) {
      const s = sums.get(o); s[0] += i % W; s[1] += (i / W) | 0; s[2]++;
      // Contour blanc : une voisine n'appartient pas à l'agent.
      const x = i % W;
      const same = (j) => (owners[j] & 0x0fff) === o;
      if ((x > 0 && !same(i - 1)) || (x < W - 1 && !same(i + 1)) || !same(i - W) || !same(i + W)) c = [255, 255, 255];
    }
    px[i * 4] = c[0]; px[i * 4 + 1] = c[1]; px[i * 4 + 2] = c[2]; px[i * 4 + 3] = 255;
  }
  base = view.image;
  // Couleurs CSS des joueurs pour les unités.
  palette = new Map(f.players.map((p) => [p.id, p.color]));
  applyUnits(f.units);
  labels = [];
  for (const a of agents) {
    const [sx, sy, n] = sums.get(a.id);
    // Étiquette au-dessus du territoire, sans sortir de la carte.
    const size = Math.max(12, Math.round(W / 60));
    if (n > 0) labels.push([`IA · ${a.name}`, Math.min(Math.max(sx / n, 3 * size), W - 3 * size), Math.max(size + 2, sy / n - 10)]);
  }
  drawOverlay();
  renderAgents(agents, f.players);

  const ranked = [...f.players].sort((a, b) => b.tiles - a.tiles);
  $("rank").innerHTML = ranked.map((p) => `
    <tr class="${p.alive ? "" : "dead"}">
      <td><span class="sw" style="background:${p.color}"></span></td>
      <td title="${esc(p.name)}">${esc(p.name)}${agentIds.has(p.id) ? '<span class="ia">IA</span>' : ""}</td>
      <td>${fmt(p.tiles)}</td><td>${fmt(p.troops)}</td><td>${fmt(p.gold)}</td>
    </tr>`).join("");
  const banner = $("banner");
  banner.style.display = f.winner ? "block" : "none";
  banner.textContent = f.winner ? `Vainqueur : ${f.winner}` : "";
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/** Panneau par agent : dernière action, actions valides par type, probabilités fournies. */
function renderAgents(agents, players) {
  $("agents").innerHTML = agents.map((a) => {
    const p = players.find((q) => q.id === a.id);
    const status = a.accepted === true ? '<span class="ok">acceptée</span>'
      : a.accepted === false ? '<span class="ko">refusée</span>' : "";
    const probs = a.annotations?.probs;
    const rows = probs
      ? Object.entries(probs).map(([k, v]) =>
          `<span>${esc(k)}</span><span class="bar"><i style="width:${Math.round(v * 100)}%"></i></span><span>${(v * 100).toFixed(0)} %</span>`).join("")
      : "";
    const valid = Object.entries(a.validCounts).filter(([, n]) => n > 0)
      .map(([k, n]) => `${esc(k)} ${n}`).join(" · ") || "aucune";
    return `<div class="agent">
      <h2><span class="sw" style="background:${p?.color ?? "#fff"}"></span> IA · ${esc(a.name)}</h2>
      <div class="act">${esc(a.lastAction)} ${status}</div>
      <div class="stat">Valides : ${valid}</div>
      ${rows ? `<div class="stat" style="margin-top:6px">Probabilités</div><div class="bars">${rows}</div>` : ""}
    </div>`;
  }).join("");
}

let ws;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  // Les messages sont traités dans l'ordre (la décompression est asynchrone).
  let chain = Promise.resolve();
  ws.onopen = () => { $("conn").textContent = "connecté"; };
  ws.onclose = () => { $("conn").textContent = "déconnecté"; setTimeout(connect, 1000); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    chain = chain.then(() => (msg.type === "map" ? onMap(msg) : onFrame(msg)));
  };
}
$("speed").addEventListener("click", (e) => {
  const v = e.target.dataset?.v;
  if (v && ws?.readyState === 1) ws.send(JSON.stringify({ type: "speed", value: v }));
});
connect();
</script>
</body>
</html>
